<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRX Tools</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #05030a;
            color: #ffffff;
            text-align: center;
            padding-top: 80px;
        }

        h1 {
            color: #e0b3ff;
            font-size: 36px;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #bfa3ff;
            font-size: 18px;
            margin-bottom: 40px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #6a0dad, #9b4dff);
            color: white;
            padding: 18px 32px;
            border-radius: 12px;
            font-size: 20px;
            text-decoration: none;
            transition: 0.2s;
            box-shadow: 0 0 18px rgba(155, 77, 255, 0.5);
            min-width: 240px;
        }

        .btn:hover {
            background: linear-gradient(135deg, #9b4dff, #c07dff);
            transform: scale(1.05);
            box-shadow: 0 0 26px rgba(192, 125, 255, 0.8);
        }

        .footer {
            margin-top: 60px;
            font-size: 13px;
            color: #7f6ca8;
        }
    </style>
</head>
<body>

    <h1>HRX Creator Network – Tools</h1>
    <p class="subtitle">Wähle dein Tool:</p>

    <div class="btn-container">
        <a class="btn" href="https://hyptryx.github.io/hrx-ambassador/">
            Ambassador Tool
        </a>

        <a class="btn" href="https://hyptryx.github.io/support-tracker/">
            Support Tracker
        </a>
    </div>

    <div class="footer">
        HRX • ShadowPhoenix • HyptryX
    </div>

</body>
</html>
