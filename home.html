<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRX Tools</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #ffffff;
            color: #3a2a5e;
            text-align: center;
        }

        /* Smooth Fade-In */
        .fade-in {
            opacity: 0;
            animation: fadeIn 1.2s ease forwards;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Floating Animation */
        .float {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0); }
        }

        /* Logo */
        .logo {
            width: 180px;
            margin-top: 60px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 12px rgba(106, 13, 173, 0.35));
        }

        /* Header */
        h1 {
            font-size: 42px;
            margin-top: 10px;
            color: #6a0dad;
            text-shadow: 0 0 12px rgba(106, 13, 173, 0.25);
        }

        p.subtitle {
            font-size: 18px;
            color: #7d5bbd;
            margin-bottom: 50px;
        }

        /* Button Container */
        .button-row {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        /* HRX Button Style */
        .hrx-btn {
            display: inline-block;
            background: linear-gradient(135deg, #6a0dad, #9b4dff);
            color: white;
            padding: 18px 32px;
            border-radius: 14px;
            font-size: 20px;
            text-decoration: none;
            transition: 0.25s;
            box-shadow: 0 0 18px rgba(155, 77, 255, 0.5);
            transform: translateY(0);
        }

        .hrx-btn:hover {
            background: linear-gradient(135deg, #9b4dff, #c07dff);
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 0 26px rgba(192, 125, 255, 0.8);
        }

        /* Footer */
        .footer {
            margin-top: 80px;
            font-size: 14px;
            color: #9c8ac7;
        }
    </style>
</head>

<body>

    <!-- ⭐ HRX LOGO -->
    <img src="hrxlogo.png" alt="HRX Logo" class="logo fade-in float">

    <h1 class="fade-in">HRX Creator Network</h1>
    <p class="subtitle fade-in">Wähle dein Tool</p>

    <div class="button-row fade-in float">
        <a class="hrx-btn" href="https://hyptryx.github.io/hrx-ambassador/">
            👑 Ambassador Tool
        </a>

        <a class="hrx-btn" href="https://hyptryx.github.io/support-tracker/">
            📊 Support Tracker
        </a>
    </div>

    <div class="footer fade-in">
        HRX • ShadowPhoenix • HyptryX
    </div>

</body>
</html>
